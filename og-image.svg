<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1094" cy="457" r="38" fill="#f57c00" opacity="0.08"/>
    <circle cx="171" cy="531" r="90" fill="#f57c00" opacity="0.17"/>
    <circle cx="497" cy="623" r="96" fill="#f57c00" opacity="0.05"/>
    <circle cx="102" cy="308" r="84" fill="#f57c00" opacity="0.13"/>
    <circle cx="67" cy="600" r="28" fill="#f57c00" opacity="0.11"/>
    <circle cx="215" cy="326" r="25" fill="#f57c00" opacity="0.14"/>
    <rect x="243" y="390" width="84" height="24" rx="8" fill="#e65100" opacity="0.07" transform="rotate(14, 1196, -90)"/>
    <rect x="162" y="248" width="25" height="50" rx="8" fill="#e65100" opacity="0.07" transform="rotate(29, 1252, 3)"/>
    <rect x="1140" y="586" width="29" height="27" rx="8" fill="#e65100" opacity="0.12" transform="rotate(10, 1183, 661)"/>
    <rect x="781" y="394" width="81" height="36" rx="8" fill="#e65100" opacity="0.04" transform="rotate(17, 126, 504)"/>
    <rect x="467" y="659" width="77" height="33" rx="8" fill="#e65100" opacity="0.11" transform="rotate(30, 652, 423)"/>
    <rect x="1285" y="377" width="96" height="62" rx="8" fill="#e65100" opacity="0.08" transform="rotate(30, 1140, 453)"/>
    <rect x="1020" y="44" width="77" height="74" rx="8" fill="#e65100" opacity="0.12" transform="rotate(0, 1029, -10)"/>
    <rect x="527" y="616" width="24" height="85" rx="8" fill="#e65100" opacity="0.11" transform="rotate(8, 777, 622)"/>
    <polygon points="389,111 441,215 337,215" fill="#f57c00" opacity="0.12"/>
    <polygon points="1089,323 1169,483 1009,483" fill="#f57c00" opacity="0.09"/>
    <polygon points="-32,317 40,461 -104,461" fill="#f57c00" opacity="0.03"/>
    <polygon points="1208,-166 1280,-22 1136,-22" fill="#f57c00" opacity="0.11"/>

  <!-- Wave at bottom -->
  <path d="M0,580 C360,605 840,555 1200,580 L1200,630 L0,630Z" fill="#f57c00" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 탈모클리닉 추천
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 탈모치료
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#ffcc80" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#ffcc80" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포 탈모클리닉 추천 — 탈모치료
  </text>
</svg>